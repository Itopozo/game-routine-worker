name: HoYoLAB Daily Check

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check HoYoLAB status
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HOYOLAB_LTUID_V2: ${{ secrets.HOYOLAB_LTUID_V2 }}
          HOYOLAB_LTOKEN_V2: ${{ secrets.HOYOLAB_LTOKEN_V2 }}
          HOYOLAB_COOKIE_TOKEN_V2: ${{ secrets.HOYOLAB_COOKIE_TOKEN_V2 }}
        run: python check_all_games.py